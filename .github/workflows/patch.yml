name: Auto Build and Release Morphe

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false
  schedule:
    # 03:17 UTC (08:47 IST). Off-peak minute (not :00) and a low-traffic hour
    # (US and EU off-hours) so GitHub does not delay the scheduled run. See STATUS.md.
    - cron: '17 3 * * *'

jobs:
  download-tools:
    name: Download Morphe Tools
    runs-on: ubuntu-latest
    if: ${{ false }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Download Morphe Tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          curl -L "https://github.com/revanced/revanced-cli/releases/latest/download/revanced-cli-all.jar" -o tools/revanced-cli.jar
          curl -L "https://github.com/revanced/revanced-patches/releases/latest/download/patches.jar" -o tools/patches.jar
          curl -L "https://github.com/revanced/revanced-integrations/releases/latest/download/app-release-unsigned.apk" -o tools/integrations.apk
      
      - name: Cache Tools
        uses: actions/cache@v4
        id: cache-tools
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}
      
      - name: Generate Cache Key
        id: cache-key
        run: echo "cache-key=${{ steps.cache-tools.outputs.cache-key || 'no-cache' }}" >> $GITHUB_OUTPUT

  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      total_count: ${{ steps.check.outputs.total_count }}
      carry_count: ${{ steps.check.outputs.carry_count }}
      incremental: ${{ steps.check.outputs.incremental }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Run Incremental Update Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
        run: |
          python scripts/check_app_updates.py

      - name: Show Plan Summary
        run: |
          echo "Total entries:   ${{ steps.check.outputs.total_count }}"
          echo "Need rebuild:    ${{ steps.check.outputs.update_count }}"
          echo "Carry over:      ${{ steps.check.outputs.carry_count }}"
          echo "Incremental:     ${{ steps.check.outputs.incremental }}"

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: |
            build_matrix.json
            carry_over.json
            new_manifest.json
          if-no-files-found: warn
          retention-days: 1

  patch-apps:
    name: Read Configuration
    needs: check-updates
    runs-on: ubuntu-latest
    if: needs.check-updates.outputs.has_updates == 'true'
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Build Matrix from Check
        id: read-matrix
        run: |
          MATRIX='${{ needs.check-updates.outputs.build_matrix }}'
          if [ -z "$MATRIX" ] || [ "$MATRIX" = "null" ]; then
            echo "Empty matrix from check; falling back to full patch-config.json"
            MATRIX=$(jq -c '.patch_list' patch-config.json)
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX" | head -c 1000

  build-apps:
    name: Build Applications
    needs: patch-apps
    runs-on: ubuntu-latest
    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.patch-apps.outputs.matrix) }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cached Tools
        uses: actions/cache@v4
        with:
          path: tools/
          key: revanced-tools-${{ hashFiles('patch-config.json', 'arch-config.json') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Optional: sign RVX (anddea) apps with the user's own keystore so existing RVX users
      # can update in place. Add repo secret RVX_KEYSTORE_BASE64 (base64 of your .jks) plus
      # RVX_KEYSTORE_PASSWORD / RVX_KEY_PASSWORD / RVX_KEY_ALIAS. Without the secret, RVX apps
      # keep using the bundled public keystore.
      - name: Set up RVX keystore (optional)
        env:
          RVX_KEYSTORE_BASE64: ${{ secrets.RVX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RVX_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$RVX_KEYSTORE_BASE64" | base64 -d > keystore/rvx.jks
            echo "RVX_KEYSTORE_PATH=keystore/rvx.jks" >> "$GITHUB_ENV"
            echo "RVX keystore configured; RVX apps will be signed with it."
          else
            echo "No RVX_KEYSTORE_BASE64 secret; RVX apps use the default public keystore."
          fi

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAWL_URL: http://localhost:8191
          RVX_KEYSTORE_PASSWORD: ${{ secrets.RVX_KEYSTORE_PASSWORD }}
          RVX_KEY_PASSWORD: ${{ secrets.RVX_KEY_PASSWORD }}
          RVX_KEY_ALIAS: ${{ secrets.RVX_KEY_ALIAS }}
        run: |
          echo "Building ${{ matrix.app_name }} with ${{ matrix.source }}..."
          sleep $((RANDOM % 30)).$((RANDOM % 100))
          
          python -m src

      - name: Record Build Outputs
        if: always()
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p build_records
          # Record every produced APK so manifest can map (app, source, arch) -> filename
          for apk in *.apk; do
            [ -e "$apk" ] || continue
            # record_build.py now detects arch from filename automatically
            APK_PATH="$apk" python scripts/record_build.py || true
          done
          echo "Records produced:"
          ls -la build_records/ 2>/dev/null || echo "(no records)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: "*.apk"

      - name: Upload Build Records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-records-${{ matrix.app_name }}-${{ matrix.source }}
          path: build_records/
          if-no-files-found: ignore

  create-single-release:
    name: Create Rolling Release
    needs: [check-updates, build-apps]
    runs-on: ubuntu-latest
    if: always() && needs.check-updates.outputs.has_updates == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Plan
        uses: actions/download-artifact@v4
        with:
          name: build-plan
          path: ./build-plan
        continue-on-error: true

      - name: Download All APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-apks
          pattern: apk-*

      - name: Download All Build Records
        uses: actions/download-artifact@v4
        with:
          path: ./all-records
          pattern: build-records-*
        continue-on-error: true

      - name: Check if Any APKs Were Built
        id: check-apks
        run: |
          built_count=$(find ./all-apks -name "*.apk" 2>/dev/null | wc -l)
          echo "Built APKs: $built_count"

          if [ "$built_count" -eq 0 ]; then
            echo "❌ No rebuilt APKs available"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "✅ $built_count rebuilt APK(s) ready for release"
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Collect All APKs
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          mkdir -p ./release-apks
          echo "📦 Collecting rebuilt APKs..."
          find ./all-apks -name "*.apk" -exec cp -f {} ./release-apks/ \; 2>/dev/null || true

          echo "📁 APKs ready for release:"
          ls -la ./release-apks/

          final_count=$(ls -1 ./release-apks/*.apk 2>/dev/null | wc -l || echo "0")
          echo "📊 Total APKs: $final_count"

      - name: Carry Over Unchanged APKs
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This build is incremental: only changed apps were rebuilt. Each release
          # must be a COMPLETE set, so bring forward every APK that was NOT rebuilt
          # this run from the current newest release (the previous build).
          PREV_TAG=$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[0].tagName' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release; new release will contain only freshly built APKs."
            exit 0
          fi
          echo "Carrying over unchanged APKs from previous release: $PREV_TAG"
          mkdir -p ./prev-apks
          gh release download "$PREV_TAG" --dir ./prev-apks --pattern '*.apk' \
            || echo "⚠️  could not download previous APKs; continuing with freshly built only"
          python scripts/merge_release_dir.py --new-dir ./release-apks --prev-dir ./prev-apks \
            || echo "⚠️  merge_release_dir.py failed; continuing with freshly built only"
          echo "📁 Combined release set:"
          ls -la ./release-apks/

      - name: Build Final Manifest
        if: steps.check-apks.outputs.skip_release == 'false'
        run: |
          echo "🧾 Building manifest.json from build-plan + build records..."
          # The new_manifest.json (post-plan baseline) lives in the build-plan artifact
          if [ -f ./build-plan/new_manifest.json ]; then
            cp ./build-plan/new_manifest.json ./new_manifest.json
          fi
          # Flatten all per-build records into one directory
          mkdir -p build_records
          if [ -d ./all-records ]; then
            find ./all-records -name "*.json" -exec cp {} build_records/ \; 2>/dev/null || true
          fi
          python scripts/merge_manifest.py || {
            echo "⚠️ merge_manifest.py failed; continuing without manifest update."
            rm -f manifest.json
          }
          if [ -f manifest.json ]; then
            echo "✅ manifest.json built:"
            jq '.entries | length' manifest.json || true
            cp manifest.json ./release-apks/manifest.json
          fi

      - name: Validate GitHub Auth
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Generate Release Notes
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generating release notes..."

          cat > release_notes.md << 'EOF'
          # Morphe APKs - Auto Built

          EOF

          # Per-app Changelog section from manifest.json (one dropdown per app).
          # Falls back to a plain asset list if the manifest is unavailable.
          if [ -f ./release-apks/manifest.json ] && \
             python scripts/generate_changelog.py --manifest ./release-apks/manifest.json --out changelog_section.md; then
            cat changelog_section.md >> release_notes.md
          else
            echo "Changelog unavailable; writing a plain app list."
            : > current_assets.txt
            for apk in ./release-apks/*.apk; do
              [ -f "$apk" ] || continue
              basename "$apk" >> current_assets.txt
            done
            sort -u current_assets.txt > release_assets.txt
            {
              echo "## Available apps"
              echo ""
              while read -r filename; do
                [ -n "$filename" ] || continue
                echo "- $filename"
              done < release_assets.txt
            } >> release_notes.md
          fi

          cat >> release_notes.md << 'EOF'

          ## Build information
          Auto built daily at 03:17 UTC (08:47 IST) when an app or patch updates. Architectures: arm64-v8a, armeabi-v7a, universal.

          ## Architecture guide
          arm64-v8a: modern ARM devices (2014 and newer)
          armeabi-v7a: older ARM devices
          universal: all ARM devices (larger file)

          ## Disclaimer
          These APKs are built automatically. Use at your own risk.
          EOF
      
      - name: Create Release And Prune Old
        id: release
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_count=$(ls -1 ./release-apks/*.apk 2>/dev/null | wc -l || echo "0")
          if [ "$apk_count" -eq 0 ]; then
            echo "❌ No APKs found to release"
            exit 1
          fi

          # Each build is its OWN immutable release (versioned filenames kept). The
          # previous build's release is left untouched, so download links already
          # published elsewhere (e.g. the WordPress/Sinker feed) keep working until
          # that release ages out of the rolling window pruned below.
          TAG="build-$(date -u +'%Y%m%d-%H%M%S')"
          TITLE="Morphe APKs - $(date -u +'%Y-%m-%d %H:%M') UTC"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          # Build the asset list: APKs (full carried-over set) + optional manifest.json
          ASSETS=( ./release-apks/*.apk )
          if [ -f ./release-apks/manifest.json ]; then
            ASSETS+=( ./release-apks/manifest.json )
            echo "📎 Including manifest.json"
          fi

          echo "🚀 Creating release $TAG with $apk_count APK(s)..."
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --latest \
            "${ASSETS[@]}"

          # Rolling window: keep only the 2 newest releases (this build + the
          # previous one). The 3rd-oldest is deleted along with its tag and assets,
          # so a published link stops working only after a newer build has been live
          # for a full update cycle - long enough for the feed to have refreshed.
          echo "🧹 Pruning old releases (keeping newest 2)..."
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' 2>/dev/null \
            | while read -r old; do
                [ -n "$old" ] || continue
                echo "  deleting old release: $old"
                gh release delete "$old" --cleanup-tag --yes \
                  || echo "  warn: could not delete $old"
              done

          echo "✅ Release publish step completed successfully!"

      - name: Display Release URL
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.release_tag }}"
          release_url=$(gh release view "$TAG" --json url --jq .url)
          echo "🔗 Release URL: $release_url"
          echo ""
          echo "📦 Direct Download Links:"
          for apk in ./release-apks/*.apk; do
            filename=$(basename "$apk")
            echo "- $filename: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$filename"
          done

  cleanup:
    name: Cleanup Workflow Runs
    needs: [build-apps, create-single-release]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 5
